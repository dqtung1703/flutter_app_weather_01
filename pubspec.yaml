name: my_app

description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  flutter_typeahead: ^4.3.8
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  lottie: ^3.0.1
  go_router: ^16.2.4
  equatable: ^2.0.7
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.0
  flutter_dotenv: ^6.0.0
  cloud_firestore: ^6.0.3
  http: ^1.1.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  # Khai báo toàn bộ file assets cần dùng cho lottie và .env
  assets:
    - .env
    - assets/lottie/rainy.json
    - assets/lottie/Clouds.json
    - assets/lottie/Sunny.json
    - assets/lottie/snow.json

  uses-material-design: true
